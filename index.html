<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c2b"><title>Ben – Race Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#f1f5f9;font:16px/1.5 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:18px 16px 90px}h1{font-size:28px;margin:0}h2{font-size:24px;margin:4px 0}h3{font-size:19px;margin:4px 0}p{margin:8px 0}.muted,small{color:#aabbd0}.teal{color:#5eead4}.amber{color:#fcd34d}section{background:#19283a;border:1px solid #34465a;border-radius:14px;padding:16px;margin:12px 0}button,select,input{font:inherit;color:inherit;background:#24384d;border:1px solid #52677d;border-radius:9px;padding:12px;min-height:46px}button{cursor:pointer}button.active{background:#5eead4;color:#10232e;font-weight:700}select{width:100%}a{color:#5eead4}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav button{flex:1;padding:10px 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.metric{font-size:24px;font-weight:700;display:block}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #34465a;padding:10px 0}label.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #34465a}input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:#5eead4}input[type=datetime-local],textarea{width:100%;margin:5px 0 10px}textarea{background:#101c2b;color:white;border:1px solid #52677d;border-radius:8px;padding:12px;font:inherit}progress{width:100%;accent-color:#5eead4}footer{position:sticky;bottom:0;background:#101c2b;padding:10px 0}.warning{border-left:3px solid #fcd34d;padding-left:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #34465a}tr[data-i]{cursor:pointer} .danger{color:#fda4af}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fcd34d}html{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{font-size:15px;line-height:1.4}main{width:100%;padding:12px 12px 24px}header h1{font-size:23px}header .warning{font-size:12px;margin:5px 0}section{padding:12px;margin:10px 0;min-width:0}h2{font-size:21px;overflow-wrap:anywhere}h3{font-size:17px}small{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid>div{min-width:0}.metric{font-size:20px;line-height:1.2;overflow-wrap:anywhere}input,select,textarea{min-width:0;max-width:100%;font-size:16px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}nav button{font-size:13px;min-width:0;padding:8px 3px}footer{position:static;font-size:12px}footer small{font-size:11px}.row>button{flex:1;min-width:0;font-size:14px}table{table-layout:fixed;font-size:12px}td,th{overflow-wrap:anywhere}th:first-child{width:39%}details summary{cursor:pointer;color:#5eead4;padding:10px 0;font-weight:600}#heading p{margin:4px 0}#heading a{display:inline-block;padding:8px 0;overflow-wrap:anywhere}.hero{border-color:#5eead4}.hero .metric{font-size:26px}.hero h2{margin-bottom:10px}@media(max-width:350px){.grid{grid-template-columns:1fr}.hero .metric{font-size:23px}} html{font-size:16px}body{font:14px/1.35 system-ui,sans-serif}main{padding:8px;max-width:540px}header{margin-bottom:8px}header h1{font-size:18px}header .warning{font-size:11px}header #storage{display:none}section{padding:10px;margin:8px 0;border-radius:10px}#station{font-size:14px;padding:8px;min-height:44px}#prev,#next{flex:0 0 48px;font-size:20px;padding:4px;min-height:44px} .station-picker{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:6px;align-items:center}#heading h2{font-size:20px;margin:8px 0 2px}#heading progress{height:8px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}nav button{white-space:normal;overflow-wrap:anywhere;font-size:12px;min-height:44px}.metric{font-size:18px}.hero .metric{font-size:21px}small{font-size:11px}h2{font-size:19px}button:disabled{opacity:.4} @media(max-width:300px){.grid{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,minmax(0,1fr))}.station-picker{grid-template-columns:40px minmax(0,1fr) 40px}#prev,#next{width:40px}} </style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"></head><body><main><header><small class="teal">WINTER ON THE DOWNS · 5–6 DEC 2026</small><h1>Ben – Race Control</h1><p class="warning amber">TEST VERSION 0.7 · Spreadsheet snapshot · provisional</p><small id="storage"></small></header><section><div class="station-picker"><button id="prev" aria-label="Previous station">‹</button><select id="station" aria-label="Select crew station"></select><button id="next" aria-label="Next station">›</button></div><div id="heading"></div></section><nav id="nav"></nav><div id="view"></div><footer><small>Offline core · navigation links need connectivity · welfare before pace</small></footer></main><script src="./race-data.js"></script><script>
const data=window.RACE_DATA;
const crew=data.checkpoints.filter(r=>r.type!=='Aid');
const names=crew.map(r=>r.name), miles=crew.map(r=>r.mile), times=crew.map(r=>r.arrival32_min), stops=crew.map(r=>r.departure32_min-r.arrival32_min);
const pins=crew.map(r=>(r.what3words||'').replace(/^\/+/,''));
const food=crew.map(r=>r.type==='Finish'?null:['rice_blocks','soreen_portions','potato_portions','honey_halves','marmite_halves','gels'].map(k=>r[k]??'TBC'));
const meals=crew.map(r=>r.meal_water_review||'To agree');
const crewActions=crew.map(r=>r.crew_actions||'To agree');
const aids=data.checkpoints.filter(r=>r.type==='Aid'||r.type==='Finish').map(r=>[r.mile,r.name,r.arrival32_min,r.cutoff_min,r.departure32_min-r.arrival32_min,r.sequence]);
const last=crew.length-1;
const tasks=['Offer allocated food / check tolerance','Refill plain water as needed','Refill electrolyte as needed','Check alertness, nausea and pain','Check heels, toes and blisters','Check warmth, dry layers and gloves','Check both torches and spare power','Check phone and Garmin charge','Retain mandatory kit','Collect waste and prepare next bag'];
let state={i:7,logs:{}};let persistent=true;try{let s=localStorage.getItem('ben-race-prototype-v1');if(s)state=JSON.parse(s)}catch(e){persistent=false}state.i=Math.max(0,Math.min(last,Number(state.i)||0));function save(){try{localStorage.setItem('ben-race-prototype-v1',JSON.stringify(state))}catch(e){persistent=false}document.getElementById('storage').textContent=persistent?'Local device log · not shared':'Storage unavailable · export log before closing'}
let tab='Progress';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{let d=Math.floor(n/1440),m=((n%1440)+1440)%1440;return ['Sat','Sun','Mon'][d]+' '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};const dur=n=>n<0?'−'+dur(-n):Math.floor(n/60)+'h '+n%60+'m';const dt=n=>{let d=new Date(Date.UTC(2026,11,5,0,n));return d.toISOString().slice(0,16)};const mins=s=>Math.round((Date.parse(s+'Z')-Date.UTC(2026,11,5))/60000);const metric=(label,val)=>`<div><small>${label}</small><span class="metric">${val}</span></div>`;
function log(){const id=crew[state.i].checkpoint_id;return state.logs[id]??(state.logs[id]=state.logs[state.i]||{checks:{}})}function choose(i){state.i=Math.max(0,Math.min(last,i));save();render()}$('station').innerHTML=names.map((n,i)=>`<option value="${i}">${String(i).padStart(2,'0')} · ${esc(n)}</option>`).join('');$('station').onchange=e=>choose(+e.target.value);$('prev').onclick=()=>choose(state.i-1);$('next').onclick=()=>choose(state.i+1);
function dest(title,n,m,t,dep,delay,cut){return `<section><small class="${cut!==undefined?'amber':'teal'}">${title}</small><h2>${esc(n)}</h2><div class="grid">${metric('From here',(m-miles[state.i]).toFixed(1)+' mi')}${metric('Race mile',m.toFixed(1)+' mi')}${metric('Planned journey',dur(t-(times[state.i]+stops[state.i])))}${metric('Revised arrival',fmt(t+delay))}</div>${cut!==undefined?`<p class="amber">${cut===null?'No cut-off in working data':'Departure deadline: '+fmt(cut)}</p>`:''}</section>`}
function render(){let i=state.i,l=log(),plan=times[i]+stops[i],arrival=l.arrival?mins(l.arrival):times[i],dep=l.departure?mins(l.departure):arrival+stops[i],delay=dep-plan; $('station').value=i;$('prev').disabled=i===0;$('next').disabled=i===last;$('heading').innerHTML=`<h2>${esc(names[i])}</h2><p class="teal">Race mile ${miles[i].toFixed(1)} / ${miles[last]} (provisional)</p><progress value="${miles[i]}" max="${miles[last]}"></progress>${pins[i]?`<p><a href="https://what3words.com/${pins[i]}" target="_blank" rel="noopener">Navigate · ///${pins[i]}</a></p>`:i===1?'<p class="amber">Exact Lewes meeting pin to agree</p>':''}`;$('nav').innerHTML=['Progress','Overview'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t==='Progress'?'Crew station':t==='Handover'?'Food & drink':t==='Overview'?'All stations':t}</button>`).join('');let html='';if(tab==='Progress'){html=`<section class="hero"><small class="teal">CURRENT STATION · BASELINE PLAN</small><div class="grid">${metric('Planned arrival',fmt(times[i]))}${metric('Planned departure',fmt(plan))}</div><p><strong>Planned stop:</strong> ${stops[i]} min · ${esc(crew[i].stop_category||'')}</p><p><strong>Purpose:</strong> ${esc(crew[i].stop_purpose||'')}</p>${crew[i].optional_nap_min?`<p class="amber">${esc(crew[i].nap_guidance)}</p>`:''}<p><strong>Prepare:</strong> ${esc(meals[i])}</p></section><section><small class="teal">BEFORE BEN ARRIVES</small><h2>Equipment &amp; setup</h2><p>${esc(crew[i].pre_arrival_setup||"To agree")}</p>${(crew[i].equipment_setup||"").split("; ").filter(Boolean).map((item,j)=>`<label class="check"><input type="checkbox" ${l.checks["setup-"+j]?"checked":""} onchange="log().checks[this.dataset.key]=this.checked;save()" data-key="setup-${j}">${esc(item)}</label>`).join("")}<p class="amber">Set up only where permitted and safe. Keep road access clear; stove outdoors only.</p></section><section><small class="teal">PREPARATION & HANDOVER</small><h2>${i===0?'Start pack':i===last?'Finish bag':'Food bag '+String(i).padStart(2,'0')}</h2><p>${esc(crewActions[i]).replace(/\n/g,'<br>')}</p>${food[i]?['Rice blocks','Soreen portions','Potato portions','Honey sandwich halves','Marmite sandwich halves','Gels'].map((n,j)=>`<div class="line"><span>${n}</span><strong>${food[i][j]}</strong></div>`).join(''):'<p>Warm drink, tolerated food, dry clothes and shoes.</p>'}<p>Plain refill: ${crew[i].plain_ml??'as needed (quantity TBC)'}${crew[i].plain_ml!=null?' ml':''}; electrolyte: ${crew[i].electrolyte_ml??'as needed (quantity TBC)'}${crew[i].electrolyte_ml!=null?' ml':''}.</p></section><section><small class="teal">WELFARE & KIT</small><h2>Handover checks</h2>${tasks.map((t,j)=>`<label class="check"><input type="checkbox" ${l.checks[j]?'checked':''} onchange="log().checks[${j}]=this.checked;save()">${t}</label>`).join('')}<p class="amber">Confusion, collapse or serious deterioration: seek medical help; emergency 999.</p></section><section><small class="teal">ARRIVAL & DEPARTURE</small><details open><summary>Record actual arrival / departure</summary><label>Actual arrival (GMT)<input id="arr" type="datetime-local" value="${esc(l.arrival||dt(times[i]))}"></label><label>Actual departure (GMT)<input id="dep" type="datetime-local" value="${esc(l.departure||dt(dep))}"></label><div class="row"><button onclick="record()">Apply actual times</button><button onclick="resetTimes()">Reset to plan</button></div><p class="${delay>0?'amber':'teal'}">${l.arrival||l.departure?'Recorded scenario':'Planning scenario'} · ${delay===0?'On plan':dur(Math.abs(delay))+(delay>0?' behind':' ahead')} at departure</p></details></section>`;if(i<last){let a=aids.find(a=>a[5]>crew[i].sequence);html+=dest('NEXT CREW / FINISH',names[i+1],miles[i+1],times[i+1],dep,delay);html+=dest('NEXT AID / FINISH · RUNNER ONLY',a[1],a[0],a[2],dep,delay,a[3]);let c=aids.find(a=>a[5]>crew[i].sequence&&a[3]!==null),finish=c[5]===crew[last].sequence,margin=30,aidStop=c[4],slack=c[3]-(c[2]+delay)-aidStop;html+=`<section><small class="amber">NEXT DEADLINE · ${esc(c[1])}</small><h2>${fmt(c[3])}</h2><div class="grid">${metric('Projected departure / finish',fmt(c[2]+delay+aidStop))}${metric('Projected time spare',dur(slack))}</div><p class="${slack<0?'danger':slack<margin?'amber':'teal'}">${slack<0?'Projected missed cut-off':slack<margin?'Below 30-minute planning buffer':'Above 30-minute planning buffer'}</p><small>Projection shifts the existing schedule by departure delay; includes planned intervening stops. No recommendation to accelerate. Clayton amendment included; East Dean order and finish mileage provisional.</small></section>`}}else if(tab==='Handover'){html=`<section><small class="teal">${i===0?'START PACK':i===last?'FINISH BAG':'FOOD BAG '+String(i).padStart(2,'0')}</small><h2>${meals[i]}</h2>${food[i]?['Rice blocks','Soreen portions','Potato portions','Honey sandwich halves','Marmite sandwich halves','Gels'].map((n,j)=>`<div class="line"><span>${n}</span><strong>${food[i][j]}</strong></div>`).join(''):'<p>Warm drink, tolerated food, dry clothes and shoes.</p>'}<p>Refill 500 ml plain and 500 ml electrolyte flasks as needed.</p><small>Provisional allocations; offer according to tolerance. Beeding Hill and Botolphs are alternatives; transfer supplies if skipping either.</small></section>`}else if(tab==='Checklist'){html=`<section><h2>Handover checklist</h2><p>${tasks.filter((_,j)=>l.checks[j]).length} of ${tasks.length} checked</p>${tasks.map((t,j)=>`<label class="check"><input type="checkbox" ${l.checks[j]?'checked':''} onchange="log().checks[${j}]=this.checked;save();render()">${t}</label>`).join('')}<p class="amber">Confusion, collapse or serious deterioration: seek medical help; emergency 999.</p></section>`}else if(tab==='Overview'){let rows=[...names.map((n,j)=>({n,m:miles[j],t:times[j],i:j})),...aids.slice(0,-1).map(a=>({n:a[1],m:a[0],t:a[2],cut:a[3]}))].sort((a,b)=>a.t-b.t);html=`<section><h2>Full race schedule</h2><p><small>Spreadsheet snapshot ${esc(data.version)} · ${esc(data.status)}</small></p><small>Tap a crew row to select it. Aid stations are runner-only. All times GMT.</small><table><thead><tr><th>Station</th><th>Mile</th><th>Plan</th><th>Cut-off</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.i!==undefined?`data-i="${r.i}" onclick="choose(${r.i});tab='Progress';render()"`:''}><td class="${r.i!==undefined?'teal':''}">${esc(r.n)}<br><small>${r.i!==undefined?'Crew / HQ':'Aid'}</small></td><td>${r.m}</td><td>${fmt(r.t)}</td><td>${r.cut?fmt(r.cut):'—'}</td></tr>`).join('')}</tbody></table></section>`}else{html=`<section><h2>Station notes</h2><label for="notes">Welfare, food taken, kit changes, water stock and crew actions</label><textarea id="notes" rows="6" oninput="log().notes=this.value;save()">${esc(l.notes)}</textarea><p>Notes are stored on this device where supported.</p><button onclick="exportLog()">Export all station logs</button></section>`}if(tab==='Progress')html+=`<section><h2>Station notes</h2><textarea aria-label="Station notes" rows="3" oninput="log().notes=this.value;save()">${esc(l.notes)}</textarea><button onclick="exportLog()">Export logs</button>${i<last?'<p><button onclick="choose(state.i+1);window.scrollTo(0,0)">Next crew station →</button></p>':''}</section>`;$('view').innerHTML=html;save()}
function record(){let a=$('arr').value,d=$('dep').value;if(!a||!d||mins(d)<mins(a)||mins(a)<420||mins(d)>4320){alert('Enter valid GMT arrival and departure times in race order.');return}log().arrival=a;log().departure=d;save();render()}function resetTimes(){delete log().arrival;delete log().departure;save();render()}function exportLog(){let blob=new Blob([JSON.stringify({version:2,dataVersion:data.version,stations:crew.map(r=>({id:r.checkpoint_id,name:r.name})),logs:state.logs},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ben-race-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></body></html>

<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c2b"><title>Ben – Race Control</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#f1f5f9;font:16px/1.5 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:18px 16px 90px}h1{font-size:28px;margin:0}h2{font-size:24px;margin:4px 0}h3{font-size:19px;margin:4px 0}p{margin:8px 0}.muted,small{color:#aabbd0}.teal{color:#5eead4}.amber{color:#fcd34d}section{background:#19283a;border:1px solid #34465a;border-radius:14px;padding:16px;margin:12px 0}button,select,input{font:inherit;color:inherit;background:#24384d;border:1px solid #52677d;border-radius:9px;padding:12px;min-height:46px}button{cursor:pointer}button.active{background:#5eead4;color:#10232e;font-weight:700}select{width:100%}a{color:#5eead4}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav button{flex:1;padding:10px 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.metric{font-size:24px;font-weight:700;display:block}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #34465a;padding:10px 0}label.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #34465a}input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:#5eead4}input[type=datetime-local],textarea{width:100%;margin:5px 0 10px}textarea{background:#101c2b;color:white;border:1px solid #52677d;border-radius:8px;padding:12px;font:inherit}progress{width:100%;accent-color:#5eead4}footer{position:sticky;bottom:0;background:#101c2b;padding:10px 0}.warning{border-left:3px solid #fcd34d;padding-left:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #34465a}tr[data-i]{cursor:pointer} .danger{color:#fda4af}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fcd34d}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"></head><body><main><header><small class="teal">WINTER ON THE DOWNS · 5–6 DEC 2026</small><h1>Ben – Race Control</h1><p class="warning amber">Prototype • planning figures unverified. Not for race-day reliance yet.</p><small id="storage"></small></header><section><label for="station">Current crew station</label><select id="station"></select><div class="row" style="margin-top:10px"><button id="prev">← Previous</button><button id="next">Next →</button></div><div id="heading"></div></section><nav id="nav"></nav><div id="view"></div><footer><small>Offline core · navigation links need connectivity · welfare before pace</small></footer></main><script>
const names=['Plumpton – Start','Lewes High Street','Butts Brow','East Dean','Seven Sisters Country Park','Bo Peep','Firle Beacon','Southease','Summer Down Car Park','Beeding Hill Car Park','Botolphs Lay-by','Findon','Bramber','Devil’s Dyke','Clayton Windmills','Ditchling Beacon','Plumpton – Finish'];
const miles=[0,8,24.4,27.9,32.6,38.7,40.6,43.7,63.3,70.6,71.4,77.5,83.2,89.7,95.5,98,102], times=[420,540,802,872,953,1068,1104,1168,1553,1712,1733,1859,1970,2100,2208,2266,2340], stops=[0,7,6,5,8,5,5,10,10,5,5,10,8,6,6,4,0];
const pins=['','','cool.blank.hears','wheels.chaos.bronzes','applauded.community.stands','prospers.birdcage.shifting','diverts.ringside.zealous','articulated.tram.chained','crossings.remodels.compiler','familiar.employers.campus','baroness.mice.obliging','held.radically.checked','armed.spires.indulges','themes.ambushes.fortified','surfacing.sigh.unzips','horseshoe.shark.hers',''];
const food=[[3,2,1,1,0,2],[7,4,3,2,1,4],[2,1,1,0,1,1],[2,1,1,1,0,1],[3,2,1,1,1,2],[1,1,1,0,0,1],[2,1,1,0,1,1],[9,5,3,2,1,6],[4,2,2,1,1,3],[1,0,0,0,0,0],[3,2,1,1,1,2],[4,2,2,1,0,3],[4,2,1,1,1,2],[3,2,1,0,0,2],[2,1,1,1,0,1],[2,1,1,0,0,1]];
const meals=['Familiar breakfast','Morning top-up','Lunch: sandwich and potatoes','Optional top-up','Afternoon snack','Dinner option: soup or noodles','Alternative dinner stop','Soup and sweet tea; overnight supplies','Soup or noodles and sweet tea','Hot snack; reserve food if skipping Botolphs','Alternative to Beeding Hill','Breakfast: honey sandwich and sweet tea','Second breakfast or soup','Morning snack','Lunch: sandwich and potatoes','Final top-up','Recovery food and dry clothing'];
const aids=[[5.8,'Offham',502,null],[10.8,'Glynde',587,null],[18.2,'Alfriston',699,null],[22.8,'Jevington',772,null],[27.9,'East Dean',864,1020],[34.2,'Litlington',987,1170],[43.3,'Southease',1153,1350],[50.4,'Housedean Farm',1288,1470],[62.8,'Saddlescombe',1536,1710],[67.8,'Mile Oak',1650,1800],[77,'Findon',1843,2010],[88.6,'Fulking',2072,2310],[97.8,'Ditchling',2254,2490],[102,'Finish',2340,2520]];
const tasks=['Offer allocated food / check tolerance','Refill plain water as needed','Refill electrolyte as needed','Check alertness, nausea and pain','Check heels, toes and blisters','Check warmth, dry layers and gloves','Check both torches and spare power','Check phone and Garmin charge','Retain mandatory kit','Collect waste and prepare next bag'];
let state={i:7,logs:{}};let persistent=true;try{let s=localStorage.getItem('ben-race-prototype-v1');if(s)state=JSON.parse(s)}catch(e){persistent=false}function save(){try{localStorage.setItem('ben-race-prototype-v1',JSON.stringify(state))}catch(e){persistent=false}document.getElementById('storage').textContent=persistent?'Local device log · not shared':'Storage unavailable · export log before closing'}
let tab='Progress';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>{let d=Math.floor(n/1440),m=((n%1440)+1440)%1440;return ['Sat','Sun','Mon'][d]+' '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};const dur=n=>n<0?'−'+dur(-n):Math.floor(n/60)+'h '+n%60+'m';const dt=n=>{let d=new Date(Date.UTC(2026,11,5,0,n));return d.toISOString().slice(0,16)};const mins=s=>Math.round((Date.parse(s+'Z')-Date.UTC(2026,11,5))/60000);const metric=(label,val)=>`<div><small>${label}</small><span class="metric">${val}</span></div>`;
function log(){return state.logs[state.i]??(state.logs[state.i]={checks:{}})}function choose(i){state.i=Math.max(0,Math.min(16,i));save();render()}$('station').innerHTML=names.map((n,i)=>`<option value="${i}">${String(i).padStart(2,'0')} · ${n}</option>`).join('');$('station').onchange=e=>choose(+e.target.value);$('prev').onclick=()=>choose(state.i-1);$('next').onclick=()=>choose(state.i+1);
function dest(title,n,m,t,dep,delay,cut){return `<section><small class="${cut!==undefined?'amber':'teal'}">${title}</small><h2>${n}</h2><div class="grid">${metric('From current station',(m-miles[state.i]).toFixed(1)+' mi')}${metric('From race start',m.toFixed(1)+' mi')}${metric('Planned journey',dur(t-(times[state.i]+stops[state.i])))}${metric('Revised arrival',fmt(t+delay))}</div>${cut!==undefined?`<p class="amber">${cut===null?'No cut-off in working data':'Departure deadline: '+fmt(cut)}</p>`:''}</section>`}
function render(){let i=state.i,l=log(),plan=times[i]+stops[i],arrival=l.arrival?mins(l.arrival):times[i],dep=l.departure?mins(l.departure):arrival+stops[i],delay=dep-plan; $('station').value=i;$('prev').disabled=i===0;$('next').disabled=i===16;$('heading').innerHTML=`<h2>${names[i]}</h2><p class="teal">Race mile ${miles[i].toFixed(1)} / 102</p><progress value="${miles[i]}" max="102"></progress>${pins[i]?`<p><a href="https://what3words.com/${pins[i]}" target="_blank" rel="noopener">Navigate · ///${pins[i]}</a></p>`:i===1?'<p class="amber">Exact Lewes meeting pin to agree</p>':''}`;$('nav').innerHTML=['Progress','Handover','Checklist','Overview','Log'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let html='';if(tab==='Progress'){html=`<section><small>32-HOUR PLAN</small><div class="grid">${metric('Planned arrival',fmt(times[i]))}${metric('Planned departure',fmt(plan))}</div><label>Actual arrival (GMT)<input id="arr" type="datetime-local" value="${esc(l.arrival||dt(times[i]))}"></label><label>Actual departure (GMT)<input id="dep" type="datetime-local" value="${esc(l.departure||dt(dep))}"></label><div class="row"><button onclick="record()">Apply actual times</button><button onclick="resetTimes()">Reset to plan</button></div><p class="${delay>0?'amber':'teal'}">${l.arrival||l.departure?'Recorded scenario':'Planning scenario'} · ${delay===0?'On plan':dur(Math.abs(delay))+(delay>0?' behind':' ahead')} at departure</p></section>`;if(i<16){let a=aids.find(a=>a[0]>miles[i]);html+=dest('NEXT AID / FINISH · RUNNER ONLY',a[1],a[0],a[2],dep,delay,a[3]);html+=dest('NEXT CREW / FINISH',names[i+1],miles[i+1],times[i+1],dep,delay);let c=aids.find(a=>a[0]>miles[i]&&a[3]!==null),finish=c[0]===102,margin=30,aidStop=finish?0:8,slack=c[3]-(c[2]+delay)-aidStop;html+=`<section><small class="amber">NEXT DEADLINE · ${c[1]}</small><h2>${fmt(c[3])}</h2><div class="grid">${metric('Projected departure / finish',fmt(c[2]+delay+aidStop))}${metric('Projected time spare',dur(slack))}</div><p class="${slack<0?'danger':slack<margin?'amber':'teal'}">${slack<0?'Projected missed cut-off':slack<margin?'Below 30-minute planning buffer':'Above 30-minute planning buffer'}</p><small>Projection shifts the existing schedule by departure delay; includes planned intervening stops. No recommendation to accelerate. Cut-offs and route order require verification.</small></section>`}}else if(tab==='Handover'){html=`<section><small class="teal">${i===0?'START PACK':i===16?'FINISH BAG':'FOOD BAG '+String(i).padStart(2,'0')}</small><h2>${meals[i]}</h2>${food[i]?['Rice blocks','Soreen portions','Potato portions','Honey sandwich halves','Marmite sandwich halves','Gels'].map((n,j)=>`<div class="line"><span>${n}</span><strong>${food[i][j]}</strong></div>`).join(''):'<p>Warm drink, tolerated food, dry clothes and shoes.</p>'}<p>Refill 500 ml plain and 500 ml electrolyte flasks as needed.</p><small>Provisional allocations; offer according to tolerance. Beeding Hill and Botolphs are alternatives; transfer supplies if skipping either.</small></section>`}else if(tab==='Checklist'){html=`<section><h2>Handover checklist</h2><p>${tasks.filter((_,j)=>l.checks[j]).length} of ${tasks.length} checked</p>${tasks.map((t,j)=>`<label class="check"><input type="checkbox" ${l.checks[j]?'checked':''} onchange="log().checks[${j}]=this.checked;save();render()">${t}</label>`).join('')}<p class="amber">Confusion, collapse or serious deterioration: seek medical help; emergency 999.</p></section>`}else if(tab==='Overview'){let rows=[...names.map((n,j)=>({n,m:miles[j],t:times[j],i:j})),...aids.slice(0,-1).map(a=>({n:a[1],m:a[0],t:a[2],cut:a[3]}))].sort((a,b)=>a.t-b.t);html=`<section><h2>Full race schedule</h2><small>Tap a crew row to select it. Aid stations are runner-only. All times GMT.</small><table><thead><tr><th>Station</th><th>Mile</th><th>Plan</th><th>Cut-off</th></tr></thead><tbody>${rows.map(r=>`<tr ${r.i!==undefined?`data-i="${r.i}" onclick="choose(${r.i});tab='Progress';render()"`:''}><td class="${r.i!==undefined?'teal':''}">${r.n}<br><small>${r.i!==undefined?'Crew / HQ':'Aid'}</small></td><td>${r.m}</td><td>${fmt(r.t)}</td><td>${r.cut?fmt(r.cut):'—'}</td></tr>`).join('')}</tbody></table></section>`}else{html=`<section><h2>Station notes</h2><label for="notes">Welfare, food taken, kit changes, water stock and crew actions</label><textarea id="notes" rows="6" oninput="log().notes=this.value;save()">${esc(l.notes)}</textarea><p>Notes are stored on this device where supported.</p><button onclick="exportLog()">Export all station logs</button></section>`}$('view').innerHTML=html;save()}
function record(){let a=$('arr').value,d=$('dep').value;if(!a||!d||mins(d)<mins(a)||mins(a)<420||mins(d)>4320){alert('Enter valid GMT arrival and departure times in race order.');return}log().arrival=a;log().departure=d;save();render()}function resetTimes(){delete log().arrival;delete log().departure;save();render()}function exportLog(){let blob=new Blob([JSON.stringify({version:1,stations:names,logs:state.logs},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Ben-race-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(console.warn)}</script></body></html>
